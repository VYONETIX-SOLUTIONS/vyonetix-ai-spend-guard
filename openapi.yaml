openapi: 3.0.3
info:
  title: VYONETIX-SOLUTIONS AI Spend Guard API
  version: 0.1.0
  description: >-
    Source-attributed text model price catalog and deterministic caller-token
    workload cost estimates. Estimates use Models.dev's MIT-licensed catalog
    and do not claim equal model quality, official invoices, or guaranteed savings.
servers:
  - url: http://127.0.0.1:8787
    description: Local Wrangler development only; no public consumer server is currently listed.
security:
  - RapidAPIKey: []
paths:
  /v1/models/prices:
    get:
      operationId: listModelPrices
      summary: List source-attributed text model rates
      description: >-
        Returns only records with numeric text input and output rates. Model
        rates are USD per one million text tokens; source timestamps and licence
        metadata accompany the response. OpenRouter provider entries are excluded.
      parameters:
        - name: provider_id
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: Exact Models.dev provider identifier, for example openai.
        - name: model_id
          in: query
          required: false
          schema: { type: string, maxLength: 180 }
          description: Exact provider model identifier.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
          description: Case-insensitive search across provider and model identifiers/names.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Filtered model rates with provenance and pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPricesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/SourceUnavailable' }
  /v1/workloads/estimate:
    post:
      operationId: estimateWorkloadCost
      summary: Estimate token-workload cost
      description: >-
        Calculates listed USD costs for up to 20 provider/model scenarios from
        source rates. Token counts are quantities only; do not send prompts or
        customer data. The result is an estimate, not an invoice or model recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenarios]
              properties:
                scenarios:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [provider_id, model_id, input_tokens, output_tokens]
                    properties:
                      provider_id: { type: string, minLength: 1, maxLength: 64 }
                      model_id: { type: string, minLength: 1, maxLength: 180 }
                      input_tokens: { type: integer, minimum: 0, maximum: 5000000 }
                      output_tokens: { type: integer, minimum: 0, maximum: 5000000 }
                      cached_input_tokens: { type: integer, minimum: 0, maximum: 5000000, default: 0 }
                      cache_write_tokens: { type: integer, minimum: 0, maximum: 5000000, default: 0 }
                      requests_per_month: { type: integer, minimum: 0, maximum: 10000000 }
      responses:
        '200':
          description: Per-scenario reproducible estimate and source metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '422':
          description: Model/rate unavailable or unsupported cache/price tier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502': { $ref: '#/components/responses/SourceUnavailable' }
components:
  securitySchemes:
    RapidAPIKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: RapidAPI consumer key. The Worker gateway secret is private and never returned to consumers.
  schemas:
    ErrorResponse:
      type: object
      required: [status, service, version, error]
      properties:
        status: { type: string, enum: [error] }
        service: { type: string }
        version: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    ModelPricesResponse:
      type: object
      required: [status, service, version, endpoint, checked_at, source_metadata, pagination, data]
      properties:
        status: { type: string, enum: [success] }
        service: { type: string }
        version: { type: string }
        endpoint: { type: string }
        checked_at: { type: string, format: date-time }
        source_metadata: { $ref: '#/components/schemas/SourceMetadata' }
        pagination:
          type: object
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            has_more: { type: boolean }
        data:
          type: array
          items: { $ref: '#/components/schemas/ModelPrice' }
    ModelPrice:
      type: object
      required: [provider_id, provider_name, model_id, model_name, currency, unit, price_usd_per_1m_tokens, source_record_updated_at]
      properties:
        provider_id: { type: string }
        provider_name: { type: string }
        model_id: { type: string }
        model_name: { type: string }
        currency: { type: string, enum: [USD] }
        unit: { type: string }
        price_usd_per_1m_tokens:
          type: object
          properties:
            input: { type: number, minimum: 0 }
            output: { type: number, minimum: 0 }
            cache_read: { type: number, nullable: true, minimum: 0 }
            cache_write: { type: number, nullable: true, minimum: 0 }
        source_record_updated_at: { type: string, nullable: true }
        has_complex_price_tiers: { type: boolean }
    EstimateResponse:
      type: object
      required: [status, service, version, endpoint, checked_at, source_metadata, calculation, data]
      properties:
        status: { type: string, enum: [success] }
        service: { type: string }
        version: { type: string }
        endpoint: { type: string }
        checked_at: { type: string, format: date-time }
        source_metadata: { $ref: '#/components/schemas/SourceMetadata' }
        calculation:
          type: object
          properties:
            formula: { type: string }
            price_unit: { type: string }
            limitations:
              type: array
              items: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              scenario_index: { type: integer }
              provider_id: { type: string }
              model_id: { type: string }
              estimated_cost_per_request_usd: { type: number, minimum: 0 }
              estimated_monthly_cost_usd: { type: number, minimum: 0 }
              cost_components_usd: { type: object, additionalProperties: { type: number, minimum: 0 } }
    SourceMetadata:
      type: object
      required: [provenance, source_url, license, license_url, freshness]
      properties:
        provenance: { type: string }
        source_url: { type: string, format: uri }
        license: { type: string }
        license_url: { type: string, format: uri }
        freshness:
          type: object
          properties:
            retrieved_at: { type: string, format: date-time }
            source_record_updated_at: { type: string, nullable: true }
            edge_cache_ttl_seconds: { type: integer }
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        endpoint: { type: string }
        checked_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            live: { type: boolean }
            source_checked: { type: boolean }
  responses:
    BadRequest:
      description: Invalid parameters or request JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Request did not pass through an authorized RapidAPI gateway.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: Request exceeds the 24 KB request-body cap.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SourceUnavailable:
      description: Upstream price catalog could not be read.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
